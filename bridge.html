<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>T3_INIT</title>
</head>
<body>
<script>
(function () {
    'use strict';

    function reply(obj) {
        document.title = 'T3_RES:' + JSON.stringify(obj);
    }

    // Only .json files of this site, so the page can't be used to fetch anything else.
    function get(msg) {
        if (!/^[\w-]+(\/[\w-]+)*\.json$/.test(msg.path)) {
            reply({ id: msg.id, ok: 0, e: 'invalid path' });
            return;
        }
        fetch(msg.path, { cache: 'no-store' })
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.text();
            })
            .then(function (text) {
                reply({ id: msg.id, ok: 1, v: text });
            }, function (e) {
                reply({ id: msg.id, ok: 0, e: String(e) });
            });
    }

    // Returns one entry of players.json: the whole table wouldn't fit into the title.
    function player(msg) {
        if (!/^\d{17}$/.test(msg.xuid)) {
            reply({ id: msg.id, ok: 0, e: 'invalid steamid' });
            return;
        }
        fetch('players.json', { cache: 'no-store' })
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function (players) {
                var found = players.filter(function (p) {
                    return Array.isArray(p.steamids) && p.steamids.indexOf(msg.xuid) >= 0;
                })[0];
                reply({ id: msg.id, ok: 1, v: found ? JSON.stringify(found) : null });
            }, function (e) {
                reply({ id: msg.id, ok: 0, e: String(e) });
            });
    }

    var PLAYED_KEY = 'test3_played_with';

    function readPlayed() {
        var data = null;
        try {
            data = JSON.parse(localStorage.getItem(PLAYED_KEY));
        } catch (e) {}
        if (!data || typeof data !== 'object') data = {};
        data.matches = data.matches || {};
        data.players = data.players || {};
        return data;
    }

    // Each match counts once: "Your Matches" returns the same matches on every sync.
    function recordMatch(msg) {
        var match = msg.match;
        if (!match || !/^[\w-]+$/.test(match.id) || !Array.isArray(match.players)) throw new Error('invalid match');
        var data = readPlayed();
        if (data.matches[match.id]) return false;
        data.matches[match.id] = 1;
        match.players.forEach(function (p) {
            if (!p || !/^\d{17}$/.test(p.xuid)) return;
            var entry = data.players[p.xuid] || { n: 0, name: '' };
            entry.n++;
            if (typeof p.name === 'string' && p.name) entry.name = p.name.slice(0, 32);
            data.players[p.xuid] = entry;
        });
        localStorage.setItem(PLAYED_KEY, JSON.stringify(data));
        return true;
    }

    // One page, most frequent first: the whole table wouldn't fit into the title.
    function listPlayers(msg) {
        var players = readPlayed().players;
        var list = Object.keys(players).map(function (xuid) {
            return { xuid: xuid, name: players[xuid].name, n: players[xuid].n };
        });
        list.sort(function (a, b) {
            return b.n - a.n || a.name.localeCompare(b.name);
        });
        var offset = Math.max(0, msg.offset | 0);
        var limit = Math.min(20, Math.max(1, msg.limit | 0));
        return JSON.stringify({ total: list.length, items: list.slice(offset, offset + limit) });
    }

    function onHash() {
        var msg;
        try {
            msg = JSON.parse(decodeURIComponent(location.hash.slice(1)));
        } catch (e) {
            return;
        }
        if (msg.op === 'get') {
            get(msg);
            return;
        }
        if (msg.op === 'player') {
            player(msg);
            return;
        }
        try {
            var v;
            if (msg.op === 'recordMatch') {
                v = recordMatch(msg);
            } else if (msg.op === 'listPlayers') {
                v = listPlayers(msg);
            } else {
                if (msg.op === 'save') localStorage.setItem(msg.k, msg.v);
                v = localStorage.getItem(msg.k);
            }
            reply({ id: msg.id, ok: 1, v: v });
        } catch (e) {
            reply({ id: msg.id, ok: 0, e: String(e) });
        }
    }

    window.addEventListener('hashchange', onHash);

    try {
        localStorage.setItem('_p', '1');
        localStorage.removeItem('_p');
        document.title = 'T3_READY:' + location.origin;
    } catch (e) {
        document.title = 'T3_NOSTORAGE:' + e;
    }
})();
</script>
</body>
</html>
