<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>T3_INIT</title>
</head>
<body>
<script>
(function () {
    'use strict';

    function reply(obj) {
        document.title = 'T3_RES:' + JSON.stringify(obj);
    }

    // Only .json files of this site, so the page can't be used to fetch anything else.
    function get(msg) {
        if (!/^[\w-]+(\/[\w-]+)*\.json$/.test(msg.path)) {
            reply({ id: msg.id, ok: 0, e: 'invalid path' });
            return;
        }
        fetch(msg.path, { cache: 'no-store' })
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.text();
            })
            .then(function (text) {
                reply({ id: msg.id, ok: 1, v: text });
            }, function (e) {
                reply({ id: msg.id, ok: 0, e: String(e) });
            });
    }

    // Returns one entry of players.json: the whole table wouldn't fit into the title.
    function player(msg) {
        if (!/^\d{17}$/.test(msg.xuid)) {
            reply({ id: msg.id, ok: 0, e: 'invalid steamid' });
            return;
        }
        fetch('players.json', { cache: 'no-store' })
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function (players) {
                var found = players.filter(function (p) {
                    return Array.isArray(p.steamids) && p.steamids.indexOf(msg.xuid) >= 0;
                })[0];
                reply({ id: msg.id, ok: 1, v: found ? JSON.stringify(found) : null });
            }, function (e) {
                reply({ id: msg.id, ok: 0, e: String(e) });
            });
    }

    var PLAYED_KEY = 'test3_played_with';

    function readPlayed() {
        var data = null;
        try {
            data = JSON.parse(localStorage.getItem(PLAYED_KEY));
        } catch (e) {}
        if (!data || typeof data !== 'object') data = {};
        data.players = data.players || {};
        data.matches = data.matches || {};
        // Older ids were "<account>_<list position>_<match>"; only the match part is stable.
        var matches = {};
        Object.keys(data.matches).forEach(function (id) { matches[stableId(id)] = 1; });
        data.matches = matches;
        return data;
    }

    function stableId(id) {
        return String(id).split('_').pop();
    }

    // Entries were { n, name } before names stopped being stored.
    function count(entry) {
        return typeof entry === 'number' ? entry : (entry && entry.n) || 0;
    }

    // Each match counts once: "Your Matches" returns the same matches on every sync.
    function recordMatch(msg) {
        var match = msg.match;
        if (!match || !/^[\w-]+$/.test(match.id) || !Array.isArray(match.players)) throw new Error('invalid match');
        var data = readPlayed();
        var id = stableId(match.id);
        if (data.matches[id]) return false;
        data.matches[id] = 1;
        match.players.forEach(function (xuid) {
            if (/^\d{17}$/.test(xuid)) data.players[xuid] = count(data.players[xuid]) + 1;
        });
        localStorage.setItem(PLAYED_KEY, JSON.stringify(data));
        return true;
    }

    // One page, most frequent first: the whole table wouldn't fit into the title.
    function listPlayers(msg) {
        var players = readPlayed().players;
        var list = Object.keys(players).map(function (xuid) {
            return { xuid: xuid, n: count(players[xuid]) };
        });
        list.sort(function (a, b) {
            return b.n - a.n || (a.xuid < b.xuid ? -1 : 1);
        });
        var offset = Math.max(0, msg.offset | 0);
        var limit = Math.min(20, Math.max(1, msg.limit | 0));
        return JSON.stringify({ total: list.length, items: list.slice(offset, offset + limit) });
    }

    // Matches are kept in IndexedDB: with the round stats they would fill localStorage quickly.
    var matchDb = null;
    var lastSaved = 0;

    function openMatches(mode) {
        if (!matchDb) {
            matchDb = new Promise(function (resolve, reject) {
                var req = indexedDB.open('test3', 2);
                req.onupgradeneeded = function (e) {
                    if (e.oldVersion < 1) {
                        req.result.createObjectStore('matches', { keyPath: 'id' }).createIndex('owner', 'owner');
                        return;
                    }
                    // Version 1 keyed matches by the unstable list id (see stableId).
                    var store = req.transaction.objectStore('matches');
                    store.openCursor().onsuccess = function (ev) {
                        var cursor = ev.target.result;
                        if (!cursor) return;
                        var match = cursor.value;
                        var id = stableId(match.id);
                        if (id !== match.id) {
                            cursor.delete();
                            match.id = id;
                            store.put(match);
                        }
                        cursor.continue();
                    };
                };
                req.onsuccess = function () { resolve(req.result); };
                req.onerror = function () { reject(req.error); };
            });
        }
        return matchDb.then(function (db) {
            return db.transaction('matches', mode).objectStore('matches');
        });
    }

    function result(req) {
        return new Promise(function (resolve, reject) {
            req.onsuccess = function () { resolve(req.result); };
            req.onerror = function () { reject(req.error); };
        });
    }

    // The addon saves the oldest match of a batch first, so a later save is a newer match.
    function newerFirst(a, b) {
        return (b.saved || 0) - (a.saved || 0);
    }

    function stripRounds(match) {
        var copy = JSON.parse(JSON.stringify(match));
        (copy.teams || []).forEach(function (team) {
            team.forEach(function (p) { delete p.rounds; });
        });
        return copy;
    }

    // Answers are sent through the title, so they stay small: pages of summaries, a match without round stats.
    var MATCH_OPS = {
        hasMatches: function (msg) {
            if (!Array.isArray(msg.ids)) throw new Error('invalid ids');
            return openMatches('readonly').then(function (store) {
                return Promise.all(msg.ids.map(function (id) { return result(store.get(stableId(id))); }));
            }).then(function (matches) {
                return JSON.stringify(matches.filter(function (m) { return m && m.full; }).map(function (m) { return m.id; }));
            });
        },
        saveMatch: function (msg) {
            var match = msg.match;
            if (!match || !/^[\w-]+$/.test(match.id) || !/^\d{17}$/.test(match.owner)) throw new Error('invalid match');
            match.id = stableId(match.id);
            return openMatches('readwrite').then(function (store) {
                // A partial match saved earlier keeps its place in the list.
                return result(store.get(match.id)).then(function (old) {
                    lastSaved = Math.max(Date.now(), lastSaved + 1);
                    match.saved = old && old.saved ? old.saved : lastSaved;
                    return result(store.put(match));
                });
            }).then(function () { return true; });
        },
        listMatches: function (msg) {
            return openMatches('readonly').then(function (store) {
                return result(store.index('owner').getAll(String(msg.owner)));
            }).then(function (matches) {
                matches.sort(newerFirst);
                var offset = Math.max(0, msg.offset | 0);
                var limit = Math.min(10, Math.max(1, msg.limit | 0));
                var items = matches.slice(offset, offset + limit).map(function (m) {
                    var team = -1, me = {};
                    (m.teams || []).forEach(function (players, t) {
                        players.forEach(function (p) {
                            if (p.xuid === m.owner) { team = t; me = p; }
                        });
                    });
                    return { id: m.id, time: m.time, map: m.map, mode: m.mode, skillGroup: m.skillGroup, score: m.score, outcome: m.outcome, team: team, k: me.kills, a: me.assists, d: me.deaths };
                });
                return JSON.stringify({ total: matches.length, items: items });
            });
        },
        getRounds: function (msg) {
            return openMatches('readonly').then(function (store) {
                return result(store.get(String(msg.matchId)));
            }).then(function (match) {
                var found = null;
                ((match && match.teams) || []).forEach(function (players) {
                    players.forEach(function (p) {
                        if (p.xuid === msg.xuid) found = p.rounds || {};
                    });
                });
                return found ? JSON.stringify(found) : null;
            });
        },
        getMatch: function (msg) {
            return openMatches('readonly').then(function (store) {
                return result(store.get(String(msg.matchId)));
            }).then(function (match) {
                return match ? JSON.stringify(stripRounds(match)) : null;
            });
        }
    };

    function onHash() {
        var msg;
        try {
            msg = JSON.parse(decodeURIComponent(location.hash.slice(1)));
        } catch (e) {
            return;
        }
        if (MATCH_OPS.hasOwnProperty(msg.op)) {
            Promise.resolve().then(function () {
                return MATCH_OPS[msg.op](msg);
            }).then(function (v) {
                reply({ id: msg.id, ok: 1, v: v });
            }, function (e) {
                reply({ id: msg.id, ok: 0, e: String(e) });
            });
            return;
        }
        if (msg.op === 'get') {
            get(msg);
            return;
        }
        if (msg.op === 'player') {
            player(msg);
            return;
        }
        try {
            var v;
            if (msg.op === 'recordMatch') {
                v = recordMatch(msg);
            } else if (msg.op === 'listPlayers') {
                v = listPlayers(msg);
            } else {
                if (msg.op === 'save') localStorage.setItem(msg.k, msg.v);
                v = localStorage.getItem(msg.k);
            }
            reply({ id: msg.id, ok: 1, v: v });
        } catch (e) {
            reply({ id: msg.id, ok: 0, e: String(e) });
        }
    }

    window.addEventListener('hashchange', onHash);

    try {
        localStorage.setItem('_p', '1');
        localStorage.removeItem('_p');
        document.title = 'T3_READY:' + location.origin;
    } catch (e) {
        document.title = 'T3_NOSTORAGE:' + e;
    }
})();
</script>
</body>
</html>
