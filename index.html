<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>test3</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #1b1e24;
            color: #d6d8dc;
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
        }
        h1 {
            margin: 0 0 4px;
            color: #ffffff;
            font-size: 26px;
            font-weight: 600;
        }
        .date {
            color: #8a8f99;
            font-size: 14px;
        }
        ul {
            margin: 16px 0 0;
            padding-left: 20px;
        }
        li {
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <h1 id="title">test3</h1>
    <div id="date" class="date"></div>
    <ul id="changes"></ul>
<script>
(function () {
    'use strict';

    fetch('version.json', { cache: 'no-store' })
        .then(function (res) { return res.json(); })
        .then(function (info) {
            document.getElementById('title').textContent = 'Update ' + info.version;
            document.getElementById('date').textContent = info.date || '';
            var list = document.getElementById('changes');
            (info.changes || []).forEach(function (change) {
                var li = document.createElement('li');
                li.textContent = change;
                list.appendChild(li);
            });
        });
})();
</script>
</body>
</html>
